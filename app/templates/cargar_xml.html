{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>Cargar Archivo XML</h2>
    <form action="/cargar-xml" method="post" enctype="multipart/form-data">
        <p>Seleccione un archivo XML:</p>
        <input type="file" name="archivo" accept=".xml" required>
        <br><br>
        <button type="submit" class="btn">Cargar XML</button>
    </form>
</div>
{% endblock %}
